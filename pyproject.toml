[project]
name = "crypto_bs"
version = "1.3.0"
description = "Compatibility redirect package for qerivative"
authors = [{name = "Seyed Mohammad Hossein Fasihi", email = "mhmd.fasihi@gmail.com"}]
requires-python = ">=3.10"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
keywords = [
    "qerivative", "crypto", "options", "compatibility", "redirect"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent"
]
dependencies = [
    "qerivative>=2.0.0a1",
]

[project.urls]
Homepage = "https://github.com/MhmdFasihi/crypto_black_scholes"
Repository = "https://github.com/MhmdFasihi/crypto_black_scholes"
Issues = "https://github.com/MhmdFasihi/crypto_black_scholes/issues"
Changelog = "https://github.com/MhmdFasihi/crypto_black_scholes/blob/main/CHANGELOG.md"
Documentation = "https://github.com/MhmdFasihi/crypto_black_scholes/tree/main/docs"

[tool.setuptools]
packages = ["crypto_bs"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "cachetools",
    "cachetools.*",
    "pandas",
    "pandas.*",
    "plotly",
    "plotly.*",
    "scipy",
    "scipy.*",
]
ignore_missing_imports = true
