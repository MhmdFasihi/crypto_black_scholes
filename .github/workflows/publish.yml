name: Build and Publish

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch: {}

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://test.pypi.org/simple/ "qerivative>=2.0.0a1"
          pip install --no-deps -e .
          pip install pytest pytest-cov
      - name: Run tests with coverage
        run: PYTHONPATH="$PWD" pytest -q --cov=crypto_bs --cov-report=term-missing --cov-fail-under=80

  publish-testpypi:
    name: Publish to TestPyPI (on main)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN != '' }}
    permissions:
      id-token: write  # for trusted publishing (if enabled)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Require TestPyPI token
        if: env.HAS_TEST_PYPI_TOKEN != 'true'
        run: |
          echo "TEST_PYPI_API_TOKEN is not configured for this repository."
          echo "Add it, then rerun this workflow manually."
          exit 1
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI (on release)
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for trusted publishing (if enabled)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
